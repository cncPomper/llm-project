# List of episodes to ingest.
#
# video_id is the 11-character YouTube video ID ONLY -- the part after ?v=
# in the URL, not the whole URL. For
#   https://www.youtube.com/watch?v=n_qKxNcMvtM
# the video_id is
#   n_qKxNcMvtM
#
# It is used both to fetch the transcript and to build the "jump to moment"
# deep links, so a full URL here breaks both.
#
# Add/remove entries freely -- this is the reproducible source of truth
# for what's in the knowledge base.

